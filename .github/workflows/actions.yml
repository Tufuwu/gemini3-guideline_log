name: Node.js CI

on:
  push:
    branches: [ main, main ]
  pull_request:
    branches: [ main, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["12", "14", "16", "17"]
        winston-version: ["winston@3"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Winston version
        run: |
          npm install ${{ matrix.winston-version }}
        # travis_retry is not a native GH Action command; 
        # standard npm install is used here to match the intent.

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

